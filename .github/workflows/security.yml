# MCO4 / C-21 and REQ-I-05: dependency gate, static-file allowlist check and test suite.
name: security-checks
on:
  push:
  pull_request:
  schedule:
    - cron: '0 1 1 * *'   # monthly audit (REQ-I-05), 09:00 Manila on the 1st
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    # The session store connects to MONGODB_URI, which under test defaults to
    # mongodb://127.0.0.1:27017/airlineDB (config/env.js), while the models use
    # mongodb-memory-server (tests/setup.js). Without a database on 27017 every
    # request that loads a session fails with HTTP 500.
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Block High/Critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Static-file allowlist (C-25)
        run: node scripts/check-static-allowlist.js
      - name: Test suite with throw-away keys
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -base64 48)"
            echo "PASSPORT_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } > .env
          npm test -- --forceExit
